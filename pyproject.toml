[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sirna-data-grabber"
version = "0.7.0"
description = "Reusable loader for the siRNA knockdown-efficacy dataset (siRNAEfficacyDB + supplementary sources), plus the fetchers that built it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Brandon Walker", email = "brandon.walker@ucsf.edu" },
]
keywords = [
    "sirna",
    "rnai",
    "gene-silencing",
    "knockdown-efficacy",
    "bioinformatics",
    "computational-biology",
    "machine-learning",
    "dataset",
    "oligonucleotide-therapeutics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/BrandonWalk/sirna-data-grabber"
Repository = "https://github.com/BrandonWalk/sirna-data-grabber"
Issues = "https://github.com/BrandonWalk/sirna-data-grabber/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-requests"]
# Only needed for sirna_data.rank_confidence_plot -- everything else in the
# package (including the rest of rank_confidence.py) has no plotting
# dependency at all.
plot = ["matplotlib>=3.7"]

# Installed automatically -- `sirna-data-fetch` fetches every source
# load_records() reads into a local directory (data/DATA_SOURCES.md), so a
# plain `pip install sirna-data-grabber` can reconstruct the dataset without
# cloning the git repo. No extra dependencies: everything under
# sirna_data/fetch/ only needs pandas (already required above) plus the
# standard library.
[project.scripts]
sirna-data-fetch = "sirna_data.fetch.cli:main"
sirna-rank-confidence = "sirna_data.rank_confidence_cli:main"
# Chart counterpart to sirna-rank-confidence -- multiple PCCs, --top-n,
# --k-max range limiting -- requires the [plot] extra (matplotlib).
sirna-rank-confidence-plot = "sirna_data.rank_confidence_plot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# long single-line TSV fixture rows are more readable unwrapped
"tests/conftest.py" = ["E501"]

[tool.mypy]
# Matches the Python version the `lint` CI job actually runs mypy under
# (.github/workflows/tests.yml), not requires-python's floor of 3.10 --
# mypy uses this to decide what stub-file syntax to accept too (not just
# our own code), and newer numpy's bundled stubs use Python 3.12-only
# syntax (PEP 695 `type` statements) that a python_version=3.10 setting
# rejects outright before ever reaching our code. Real cross-version
# compatibility (3.10/3.11/3.12) is already verified by the separate
# `test` job's pytest matrix, so this doesn't weaken that guarantee.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
